[package]
name = "grpc-webrtc-rsbridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
reachy-api = { path = "../reachy-api" }
clap = { version = "4.5.48", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
gst = { version = "0.23.7", package = "gstreamer" }
gst-plugin-webrtc = { version = "0.13.7", default-features = false }
gstwebrtc = { version = "0.23.5", package = "gstreamer-webrtc" }
glib = "0.20.12"
mpsc = "0.2.6"
tonic = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"
tokio = "1.47.1"
signal-hook = "0.3.18"
regex = "1.11.2"
uuid = "1.18.1"
async-tungstenite = { version = "0.29.1", features = ["tokio-runtime"] }
futures = "0.3.31"
serde_json = "1.0.145"
